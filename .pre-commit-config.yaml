repos:
  # 1. Basic formatting and file hygiene
  - repo: git@github.com:pre-commit/pre-commit-hooks.git
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  # 2. Clang-format formatting hook
  - repo: git@github.com:pre-commit/mirrors-clang-format.git
    rev: v18.1.5
    hooks:
      - id: clang-format
        args: [--style=file]

