; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
;default_envs = esp8266-test
;default_envs = esp32, esp8266
;default_envs = esp32
;default_envs = esp32c3_supermini
default_envs = heltec_v3

[env:esp32]
framework = arduino
platform = espressif32
board = esp32dev ;esp32dev ;az-delivery-devkit-v4
board_build.mcu = esp32
lib_deps = rweather/Crypto, PubSubClient

[env:esp32c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
lib_deps = rweather/Crypto, PubSubClient
build_flags =
    -DESP32C3_SUPERMINI=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_ESP32C3_DEV=1
upload_port = /dev/ttyACM0

[env:heltec_v3]
platform = espressif32 @ ^6.5.0
board = heltec_wifi_lora_32_V3
framework = arduino
lib_deps =
    rweather/Crypto
    PubSubClient
    jgromes/RadioLib @ ^6.6.0
build_flags =
    -DHELTEC_V3=1
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DUSE_SX1262=1
build_src_filter = +<*> -<WaterMeter.cpp> -<test_heltec.cpp>
upload_port = /dev/tty.usbserial-0001
monitor_port = /dev/tty.usbserial-0001
monitor_speed = 115200
upload_speed = 921600

[env:heltec_v3_test]
platform = espressif32 @ ^6.5.0
board = heltec_wifi_lora_32_V3
framework = arduino
build_flags =
    -DHELTEC_V3=1
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
build_src_filter = +<*> -<main.cpp> -<WaterMeter.cpp> -<WMBusFrame.cpp>
upload_port = /dev/tty.usbserial-0001
monitor_port = /dev/tty.usbserial-0001
monitor_speed = 115200
upload_speed = 921600

[env:esp8266]
framework = arduino
platform = espressif8266
board = d1_mini_lite
board_build.mcu = esp8266
lib_deps = rweather/Crypto @ ^0.2.0
; OTA
;upload_port = 10.0.0.86
;upload_protocol = espota
